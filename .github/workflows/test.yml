name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    # Oxigraph's default image CMD is already `serve --location /data --bind
    # 0.0.0.0:7878` (confirmed via `docker inspect`), so no command override
    # is needed here - GitHub Actions service containers can't pass one
    # anyway (services support image/ports/env/volumes/options, not CMD
    # args). Fuseki is *not* wired in here: its image needs dataset-creation
    # args at startup with no equivalent env-var config, which service
    # containers can't supply - full-Fuseki coverage stays manual-only for
    # now (tests/integration/test_fuseki_backend.py's own docstring has the
    # docker run command), matching the "decide later whether to add to a
    # schedule" call on that tier. Every Fuseki-only test class in
    # tests/integration/ already self-skips when Fuseki isn't reachable
    # (see e.g. test_fuseki_backend.py's `_fuseki_available()`), so running
    # the whole integration marker here with only Oxigraph up is safe - it
    # exercises the Oxigraph and SQLite coverage and skips the rest.
    services:
      oxigraph:
        image: ghcr.io/oxigraph/oxigraph
        ports:
          - 7878:7878

    steps:
      - uses: actions/checkout@v4
        with:
          path: rdflib-starlight

      # Sibling checkout: rdflib-starlight depends on sparql1_2_to_rdf (see
      # pyproject.toml) for its SPARQL 1.2 engine (query/update parsing and
      # lowering) - installed editable from ../sparql1.2_to_rdf, same
      # relative layout local development already uses.
      - uses: actions/checkout@v4
        with:
          repository: hidden-graph/sparql1.2_to_rdf
          path: sparql1.2_to_rdf

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        working-directory: rdflib-starlight
        run: pip install -e ".[sqlalchemy,test]" -e ../sparql1.2_to_rdf

      - name: Wait for Oxigraph
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:7878/ >/dev/null && exit 0
            sleep 1
          done
          echo "Oxigraph did not become ready in time" >&2
          exit 1

      - name: Run unit and W3C tests
        working-directory: rdflib-starlight
        run: pytest tests/ -m "not integration" -v

      - name: Run integration tests (Oxigraph + SQLite; Fuseki-only tests self-skip)
        working-directory: rdflib-starlight
        run: pytest tests/ -m "integration" -v
